name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://pengopal.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the build settings
        run: node scripts/check-deploy-env.mjs

      - name: Build
        run: npm run build

      # JSON, not .env, so nothing in the values is expanded. The file lives outside the repo.
      - name: Write Worker secrets
        env:
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
        run: |
          jq -n --arg t "$TURNSTILE_SECRET" --arg c "$CONTACT_TO" \
            '{TURNSTILE_SECRET: $t, CONTACT_TO: $c}' > "$RUNNER_TEMP/worker-secrets.json"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"

      - name: Remove the secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
